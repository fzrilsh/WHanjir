name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_HOST_PRIMARY: whanjir.fazrilsh.com
          VITE_API_HOST_FALLBACK: intergonial-expansive-vinnie.ngrok-free.dev
          VITE_API_PORT: ""
          VITE_WS_PROTOCOL: https

      - name: Deploy to dist branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Switch to an orphan branch (no history)
          git checkout --orphan dist

          # Remove all tracked files from the orphan branch
          git rm -rf . || true

          # Copy built dist to repo root
          rsync -a dist/ ./

          # Add .nojekyll for GitHub Pages (if needed)
          touch .nojekyll

          # Stage and commit
          git add -A
          git commit -m "deploy: $(date +'%Y-%m-%d %H:%M:%S')"

          # Force push to dist branch
          git push origin dist --force
