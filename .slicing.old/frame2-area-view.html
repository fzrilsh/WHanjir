<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame 2 - Area View</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-8">
  <div class="w-[402px] h-[874px] bg-white rounded-[30px] overflow-hidden relative shadow-2xl" id="frame2">

    <!-- Map Placeholder -->
    <div class="absolute inset-0 bg-[#E8EDF2]"></div>

    <!-- Search Bar -->
    <div class="absolute top-[18px] left-[24px] w-[360px] h-[56px] z-10">
      <div class="w-full h-full bg-white rounded-[16px] shadow-lg flex items-center px-4">
        <span class="text-[14px] text-[#49454F] font-normal flex-1">Search place...</span>
        <svg class="w-6 h-6 text-[#49454F] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <!-- View Toggle (Area / Road) -->
    <div class="absolute top-[90px] left-1/2 -translate-x-1/2 z-10">
      <div class="flex bg-white/80 backdrop-blur-md rounded-full p-1 shadow-md" style="width: 214px; height: 44px;">
        <!-- Road View (inactive) -->
        <button class="flex-1 h-full rounded-full flex items-center justify-center transition-all bg-transparent">
          <span class="text-[14px] font-semibold tracking-[0.1px] leading-5 text-[#414754]">Road View</span>
        </button>
        <!-- Area View (active) -->
        <button class="flex-1 h-full rounded-full flex items-center justify-center transition-all"
                style="background-color: #005bbf;">
          <span class="text-[14px] font-semibold tracking-[0.1px] leading-5 text-white">Area View</span>
        </button>
      </div>
    </div>

    <!-- Zoom Controls -->
    <div class="absolute bottom-[15px] right-[11px] flex flex-col gap-2 z-10">
      <button class="w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center hover:bg-gray-50 transition-colors">
        <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" stroke-width="2"/>
          <path stroke-linecap="round" stroke-width="2.5" d="M16.5 16.5L21 21"/>
          <path stroke-linecap="round" stroke-width="2.5" d="M11 8v6M8 11h6"/>
        </svg>
      </button>
    </div>

  </div>
</body>
</html>
