<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame 5 - Road Detail Bottom Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-900 min-h-screen flex items-center justify-center p-8">
  <div class="w-[400px] h-[874px] bg-white rounded-[30px] overflow-hidden relative shadow-2xl">

    <!-- Map Placeholder -->
    <div class="absolute inset-0 bg-[#E8EDF2]"></div>

    <!-- Search Bar -->
    <div class="absolute top-[18px] left-[24px] w-[360px] h-[56px] z-10">
      <div class="w-full h-full bg-white rounded-[16px] shadow-lg flex items-center px-4">
        <span class="text-[14px] text-[#49454F] font-normal flex-1">Search place...</span>
        <svg class="w-6 h-6 text-[#49454F] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
    </div>

    <!-- LEVEL 1: Floating Surface (Bottom Sheet) -->
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[24px] shadow-[0_-8px_40px_rgba(0,0,0,0.15)]"
      style="height: 532px;">

      <!-- Drag Handle -->
      <div class="flex justify-center pt-4 pb-3">
        <div class="w-12 h-1.5 bg-[#C1C6D6] rounded-full"></div>
      </div>

      <!-- Container -->
      <div class="px-4">

        <!-- Header Section -->
        <div class="flex items-start justify-between">
          <div>
            <!-- Street name + location pin icon -->
            <div class="flex items-center gap-2">
              <svg width="19" height="19" viewBox="0 0 19 19" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M14 19V16H11V14H14V11H16V14H19V16H16V19H14ZM14 9V0H16V9H14ZM0 16V0H2V16H0ZM7 4V0H9V4H7ZM7 10V6H9V10H7ZM7 16V12H9V16H7Z"
                  fill="#727785" />
              </svg>
              <h2 class="text-xl font-semibold text-[#1A1B1E] leading-7 tracking-[0]">Jl. Daan Mogot</h2>
            </div>
            <!-- Kelurahan -->
            <div class="flex items-center gap-2 ml-[27px] mt-1">
              <!-- Location Pin Icon (from Figma) -->
              <svg width="11" height="14" viewBox="0 0 11 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M5.33333 6.66667C5.7 6.66667 6.01389 6.53611 6.275 6.275C6.53611 6.01389 6.66667 5.7 6.66667 5.33333C6.66667 4.96667 6.53611 4.65278 6.275 4.39167C6.01389 4.13056 5.7 4 5.33333 4C4.96667 4 4.65278 4.13056 4.39167 4.39167C4.13056 4.65278 4 4.96667 4 5.33333C4 5.7 4.13056 6.01389 4.39167 6.275C4.65278 6.53611 4.96667 6.66667 5.33333 6.66667ZM5.33333 11.5667C6.68889 10.3222 7.69444 9.19167 8.35 8.175C9.00556 7.15833 9.33333 6.25556 9.33333 5.46667C9.33333 4.25556 8.94722 3.26389 8.175 2.49167C7.40278 1.71944 6.45556 1.33333 5.33333 1.33333C4.21111 1.33333 3.26389 1.71944 2.49167 2.49167C1.71944 3.26389 1.33333 4.25556 1.33333 5.46667C1.33333 6.25556 1.66111 7.15833 2.31667 8.175C2.97222 9.19167 3.97778 10.3222 5.33333 11.5667ZM5.33333 13.3333C3.54444 11.8111 2.20833 10.3972 1.325 9.09167C0.441667 7.78611 0 6.57778 0 5.46667C0 3.8 0.536111 2.47222 1.60833 1.48333C2.68056 0.494444 3.92222 0 5.33333 0C6.74444 0 7.98611 0.494444 9.05833 1.48333C10.1306 2.47222 10.6667 3.8 10.6667 5.46667C10.6667 6.57778 10.225 7.78611 9.34167 9.09167C8.45833 10.3972 7.12222 11.8111 5.33333 13.3333Z"
                  fill="#414754" />
              </svg>
              <span class="text-xs font-medium text-[#414754] leading-4">Kelurahan: Wijaya Kusuma</span>
            </div>
          </div>
          <!-- Close Button -->
          <button
            class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors flex-shrink-0 mt-0.5">
            <svg class="w-5 h-5 text-[#414754]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Structured Grid: Metrics -->
        <div class="mt-6 flex flex-col gap-3">

          <!-- Primary Status Card - red border, light red bg -->
          <div class="rounded-3xl p-4 relative overflow-hidden"
            style="background-color: rgba(255,218,214,0.3); border: 1px solid rgba(186,26,26,0.2);">
            <!-- Decorative circle top-right -->
            <div class="absolute -right-8 -top-16 w-32 h-32 rounded-full opacity-10" style="background-color: #BA1A1A;">
            </div>

            <div class="relative z-[1]">
              <!-- STATUS AREA label + BANJIR PARAH badge -->
              <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-medium text-[#414754] tracking-[0.6px]">STATUS AREA</span>
                <div class="flex items-center gap-1.5 rounded-full px-3 py-1" style="background-color: #BA1A1A;">
                  <!-- Warning triangle icon -->
                  <svg class="w-[12.83px] h-[11.08px] flex-shrink-0" viewBox="0 0 13 12" fill="none">
                    <path d="M6.5 0L13 12H0L6.5 0Z" fill="white" />
                    <path d="M6.5 3.5V7.5M6.5 9V9.5" stroke="#BA1A1A" stroke-width="1.5" stroke-linecap="round" />
                  </svg>
                  <span class="text-[11px] font-bold text-white tracking-[0.275px] leading-4">BANJIR PARAH</span>
                </div>
              </div>

              <!-- 60 cm -->
              <div class="flex items-baseline gap-[2.4px]">
                <span class="text-[32px] font-bold leading-10 tracking-[-0.64px]" style="color: #BA1A1A;">60</span>
                <span class="text-2xl font-semibold leading-8 tracking-[-0.64px]" style="color: #BA1A1A;">cm</span>
              </div>

              <!-- Tinggi Air Saat Ini -->
              <p class="text-[11px] font-medium text-[#414754] tracking-[0.5px] leading-4 mt-1">Tinggi Air Saat Ini</p>
            </div>
          </div>

          <!-- Sensor Info Card -->
          <div class="rounded-[48px] p-4 flex items-center gap-4 bg-white border border-[#E3E2E6]">
            <!-- Sensor Icon -->
            <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0"
              style="background-color: rgba(186,26,26,0.1);">
              <svg width="20" height="15" viewBox="0 0 20 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M2.925 14.15C2.025 13.2333 1.3125 12.1708 0.7875 10.9625C0.2625 9.75417 0 8.45833 0 7.075C0 5.675 0.2625 4.37083 0.7875 3.1625C1.3125 1.95417 2.025 0.9 2.925 0L4.35 1.425C3.61667 2.15833 3.04167 3.00833 2.625 3.975C2.20833 4.94167 2 5.975 2 7.075C2 8.19167 2.20833 9.23333 2.625 10.2C3.04167 11.1667 3.61667 12.0083 4.35 12.725L2.925 14.15ZM5.75 11.325C5.21667 10.775 4.79167 10.1375 4.475 9.4125C4.15833 8.6875 4 7.90833 4 7.075C4 6.225 4.15833 5.4375 4.475 4.7125C4.79167 3.9875 5.21667 3.35833 5.75 2.825L7.175 4.25C6.80833 4.61667 6.52083 5.04167 6.3125 5.525C6.10417 6.00833 6 6.525 6 7.075C6 7.625 6.10417 8.14167 6.3125 8.625C6.52083 9.10833 6.80833 9.53333 7.175 9.9L5.75 11.325ZM10 9.075C9.45 9.075 8.97917 8.87917 8.5875 8.4875C8.19583 8.09583 8 7.625 8 7.075C8 6.525 8.19583 6.05417 8.5875 5.6625C8.97917 5.27083 9.45 5.075 10 5.075C10.55 5.075 11.0208 5.27083 11.4125 5.6625C11.8042 6.05417 12 6.525 12 7.075C12 7.625 11.8042 8.09583 11.4125 8.4875C11.0208 8.87917 10.55 9.075 10 9.075ZM14.25 11.325L12.825 9.9C13.1917 9.53333 13.4792 9.10833 13.6875 8.625C13.8958 8.14167 14 7.625 14 7.075C14 6.525 13.8958 6.00833 13.6875 5.525C13.4792 5.04167 13.1917 4.61667 12.825 4.25L14.25 2.825C14.7833 3.35833 15.2083 3.9875 15.525 4.7125C15.8417 5.4375 16 6.225 16 7.075C16 7.90833 15.8417 8.6875 15.525 9.4125C15.2083 10.1375 14.7833 10.775 14.25 11.325ZM17.075 14.15L15.65 12.725C16.3833 11.9917 16.9583 11.1417 17.375 10.175C17.7917 9.20833 18 8.175 18 7.075C18 5.95833 17.7917 4.91667 17.375 3.95C16.9583 2.98333 16.3833 2.14167 15.65 1.425L17.075 0C17.975 0.9 18.6875 1.95417 19.2125 3.1625C19.7375 4.37083 20 5.675 20 7.075C20 8.45833 19.7375 9.75417 19.2125 10.9625C18.6875 12.1708 17.975 13.2333 17.075 14.15Z"
                  fill="#BA1A1A" />
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-xs font-medium text-[#414754] leading-4">Sumber Data</p>
              <p class="text-sm font-medium text-[#1A1B1E] leading-5 mt-0.5">Sensor Banjir JB-012</p>
            </div>
          </div>

          <!-- Risk Score Card -->
          <div class="rounded-[48px] p-4 bg-white border border-[#E3E2E6]">
            <!-- Tingkat Risiko label + score -->
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-medium text-[#414754] leading-4">Tingkat Risiko</span>
              <div class="flex items-baseline gap-0.5">
                <span class="text-sm font-bold leading-5 tracking-[0.1px]" style="color: #BA1A1A;">91</span>
                <span class="text-[11px] font-normal text-[#414754] tracking-[0.5px] leading-4">/100</span>
              </div>
            </div>

            <!-- Progress Bar -->
            <div class="h-[10px] bg-[#E3E2E6] rounded-full overflow-hidden">
              <div class="h-full rounded-full relative overflow-hidden" style="width: 91%; background-color: #BA1A1A;">
                <!-- Striped pattern -->
                <div class="absolute inset-0"
                  style="background: repeating-linear-gradient(-45deg, rgba(255,255,255,0.2) 0px, rgba(255,255,255,0.2) 2px, transparent 2px, transparent 5px);">
                </div>
              </div>
            </div>

            <!-- Aman - Kritis labels -->
            <div class="flex items-center justify-between mt-1.5">
              <span class="text-[11px] font-medium text-[#414754] opacity-70 tracking-[0.5px] leading-4">Aman</span>
              <span class="text-[11px] font-medium text-[#414754] opacity-70 tracking-[0.5px] leading-4">Kritis</span>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>
</body>

</html>
