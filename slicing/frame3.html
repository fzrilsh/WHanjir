<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame 3 - Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-8">
  <div class="w-[402px] h-[874px] bg-white rounded-[30px] overflow-hidden relative shadow-2xl flex flex-col">

    <!-- Top Section: Back Button + Search Bar -->
    <div class="px-4 pt-4 pb-2 flex items-center gap-3">
      <!-- Back Button -->
      <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors flex-shrink-0">
        <!-- Icon 1-->
      </button>

      <!-- Search Bar with X clear button -->
      <div class="flex-1 h-12 bg-gray-100 rounded-full flex items-center px-4 gap-3">
        <span class="text-sm text-black-400 flex-1">Jakarta Barat|</span>
          <!-- Icon 2 -->
      </div>
    </div>

    <!-- Divider -->
    <div class="h-px bg-gray-100"></div>

    <!-- Main Content: Scrollable -->
    <div class="flex-1 overflow-y-auto">

      <!-- Section: Pencarian Terkini -->
      <div class="px-4 pt-5 pb-3">
        <h2 class="text-sm font-semibold text-gray-800 mb-3">Pencarian Terkini</h2>
        <div class="flex flex-col gap-2">

          <!-- Recent Item 1 - Red (Water Rising / Danger) -->
          <div class="flex items-center justify-between py-2.5 px-1 hover:bg-gray-50 rounded-lg transition-colors cursor-pointer">
            <div class="flex items-center gap-3">
              <!-- Icon 3 -->
              <span class="text-sm text-gray-700">Jl. Kebon Jeruk Raya</span>
            </div>
            <div class="w-3 h-3 rounded-full bg-red-500 flex-shrink-0"></div>
          </div>

          <!-- Recent Item 2 - Yellow (Starts to Rise) -->
          <div class="flex items-center justify-between py-2.5 px-1 hover:bg-gray-50 rounded-lg transition-colors cursor-pointer">
            <div class="flex items-center gap-3">
              <!-- Icon 3 -->
              <span class="text-sm text-gray-700">Jl. Tanjung Duren Utara</span>
            </div>
            <div class="w-3 h-3 rounded-full bg-yellow-500 flex-shrink-0"></div>
          </div>

          <!-- Recent Item 3 - Green (Safe) -->
          <div class="flex items-center justify-between py-2.5 px-1 hover:bg-gray-50 rounded-lg transition-colors cursor-pointer">
            <div class="flex items-center gap-3">
              <!-- Icon 3 -->
              <span class="text-sm text-gray-700">Jl. Palmerah Barat</span>
            </div>
            <div class="w-3 h-3 rounded-full bg-green-500 flex-shrink-0"></div>
          </div>

          <!-- Recent Item 4 - Red -->
          <div class="flex items-center justify-between py-2.5 px-1 hover:bg-gray-50 rounded-lg transition-colors cursor-pointer">
            <div class="flex items-center gap-3">
              <!-- Icon 3 -->
              <span class="text-sm text-gray-700">Jl. Kembangan Raya</span>
            </div>
            <div class="w-3 h-3 rounded-full bg-red-500 flex-shrink-0"></div>
          </div>

          <!-- Recent Item 5 - Yellow -->
          <div class="flex items-center justify-between py-2.5 px-1 hover:bg-gray-50 rounded-lg transition-colors cursor-pointer">
            <div class="flex items-center gap-3">
              <!-- Icon 3 -->
              <span class="text-sm text-gray-700">Jl. Daan Mogot</span>
            </div>
            <div class="w-3 h-3 rounded-full bg-yellow-500 flex-shrink-0"></div>
          </div>

        </div>
      </div>

      <!-- Divider -->
      <div class="h-2 bg-gray-50"></div>

      <!-- Section: Kelurahan Jakarta Barat -->
      <div class="px-4 pt-5 pb-6">
        <h2 class="text-sm font-semibold text-gray-800 mb-3">Kelurahan Jakarta Barat</h2>
        <div class="flex flex-wrap gap-2">

          <span class="px-4 py-2 text-xs font-medium text-[#414754] bg-[#faf9fd] border border-[#c1c6d6] rounded-full cursor-pointer hover:bg-gray-100 transition-colors">Cengkareng</span>
          <span class="px-4 py-2 text-xs font-medium text-[#414754] bg-[#faf9fd] border border-[#c1c6d6] rounded-full cursor-pointer hover:bg-gray-100 transition-colors">Grogol Petamburan</span>
          <span class="px-4 py-2 text-xs font-medium text-[#414754] bg-[#faf9fd] border border-[#c1c6d6] rounded-full cursor-pointer hover:bg-gray-100 transition-colors">Kalideres</span>
          <span class="px-4 py-2 text-xs font-medium text-[#414754] bg-[#faf9fd] border border-[#c1c6d6] rounded-full cursor-pointer hover:bg-gray-100 transition-colors">Kebon Jeruk</span>
          <span class="px-4 py-2 text-xs font-medium text-[#414754] bg-[#faf9fd] border border-[#c1c6d6] rounded-full cursor-pointer hover:bg-gray-100 transition-colors">Kembangan</span>
          <span class="px-4 py-2 text-xs font-medium text-[#414754] bg-[#faf9fd] border border-[#c1c6d6] rounded-full cursor-pointer hover:bg-gray-100 transition-colors">Palmerah</span>
          <span class="px-4 py-2 text-xs font-medium text-[#414754] bg-[#faf9fd] border border-[#c1c6d6] rounded-full cursor-pointer hover:bg-gray-100 transition-colors">Taman Sari</span>
          <span class="px-4 py-2 text-xs font-medium text-[#414754] bg-[#faf9fd] border border-[#c1c6d6] rounded-full cursor-pointer hover:bg-gray-100 transition-colors">Tambora</span>

        </div>
      </div>

    </div>
  </div>
</body>
</html>
